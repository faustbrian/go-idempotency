schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzKeyAndFingerprintValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFingerprintPolicyVersionsRemainDistinct$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzJSONIsIdempotent$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzBytesFingerprintPreservesEncoding$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./idempotencyhttp]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./idempotencyrpc]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzTakeoverPermanentlyFencesOldOwner$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzPersistedRecordDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./valkey]
        fuzz: '^FuzzPersistedHashDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
