schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["./memory"]
        run: '^Test(ConcurrentAcquireElectsOneOwner|ExpiredLeaseTakeoverFencesPreviousOwner)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzKeyAndFingerprintValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFingerprintPolicyVersionsRemainDistinct$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzJSONIsIdempotent$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzBytesFingerprintPreservesEncoding$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./adapters/http]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./adapters/jsonrpc]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzTakeoverPermanentlyFencesOldOwner$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzPersistedRecordDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./valkey]
        fuzz: '^FuzzPersistedHashDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
