schema_version: 1
tool_version: v1.6.1
tool_checksums_sha256: 9a93685df9ad17819a9f96d0cc62e64750ea2b02e808a045d45ca6cf1e908a21
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzKeyAndFingerprintValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFingerprintPolicyVersionsRemainDistinct$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzJSONIsIdempotent$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzBytesFingerprintPreservesEncoding$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./adapters/http]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./adapters/jsonrpc]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzTakeoverPermanentlyFencesOldOwner$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzPersistedRecordDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./valkey]
        fuzz: '^FuzzPersistedHashDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
