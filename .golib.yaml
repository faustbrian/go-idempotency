schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzKeyAndFingerprintValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzFingerprintPolicyVersionsRemainDistinct$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzJSONIsIdempotent$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./canonical]
        fuzz: '^FuzzBytesFingerprintPreservesEncoding$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./idempotencyhttp]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./idempotencyrpc]
        fuzz: '^FuzzMalformedReplayFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzTakeoverPermanentlyFencesOldOwner$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzPersistedRecordDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./valkey]
        fuzz: '^FuzzPersistedHashDecoderFailsClosed$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
